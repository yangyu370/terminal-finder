name: MyGo Windows native terminal
on:
  push:
    branches: [codex/mygo-drawn-windows-handoff]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-native:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/clients/MyGo/.cache/rust-target
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.2'
          cache-dependency-path: clients/MyGo/go.sum
      - name: Rust Windows path, IPC, and FFI/WS contract tests
        shell: pwsh
        run: |
          cargo test --locked --manifest-path core/Cargo.toml --lib windows_ -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native ConPTY, PowerShell, and rendered MyGo tests
        shell: pwsh
        run: ./clients/MyGo/test-windows.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-terminal-evidence
          path: |
            clients/MyGo/.cache/windows-tests.log
            clients/MyGo/.cache/windows-terminal.png
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: windows-x64-mvp
          path: |
            clients/MyGo/dist/terminal-finder-drawn.exe
            clients/MyGo/dist/core.exe
            clients/MyGo/dist/ghostty-vt.dll
